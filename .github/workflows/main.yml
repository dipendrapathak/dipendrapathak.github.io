name: Scheduled API Test

on:
  schedule:
    - cron: '0 9 * * *'  # Runs every day at 9 AM UTC
  workflow_dispatch:

jobs:
  test-endpoint:
    runs-on: ubuntu-latest

    steps:
      - name: Send POST request with Basic Auth
        run: |
          # Define credentials
          USERNAME="Revol14617"
          PASSWORD="2piWKz9u8GXrJRc5O36n70MVWvSwoXJm"

          # Define JSON body
          BODY='{
                    "payload": [
                        {
                            "country": "NZ",
                            "fullAddress": "417"
                        }
                    ],
                    "featureOptions": {
                        "caseType": "TITLE"
                    }
                }'

          # Send POST request
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://tstapi.revolutionnext.com.au/address/find \
            -H "Content-Type: application/json" \
            -u "$USERNAME:$PASSWORD" \
            -d "$BODY")

          echo "Response code: $response"
          if [ "$response" -ne 200 ]; then
            echo "API test failed with response code $response"
            exit 1
          fi
